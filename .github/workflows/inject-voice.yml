name: Enable JARVIS Voice Engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, 'jarvis voice injection') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject voice script into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="/jarvis-voice.js"></script>'
          if tag not in text:
              text = text.replace('</body>', f'{tag}\n</body>')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit injected script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "jarvis voice injection"
          git push
